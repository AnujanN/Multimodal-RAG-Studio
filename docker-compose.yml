services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: chunker
      POSTGRES_PASSWORD: chunker_pass
      POSTGRES_DB: chunking_playground
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chunker -d chunking_playground"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
