services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: chunker
      POSTGRES_PASSWORD: chunker_pass
      POSTGRES_DB: chunking_playground
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chunker -d chunking_playground"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://chunker:chunker_pass@postgres:5432/chunking_playground
      CORS_ORIGINS: "http://localhost,http://localhost:5173"
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-random-64char-secret-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
